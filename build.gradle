plugins {
    id 'java'
    id 'jigsaw-cosmic-reach'
}

group = p_group
version = p_version

jigsawGame {
    splitSourceSets()
}

jigsawAccess {
    addManipulators(file("$projectDir/src/common/resources/${p_id}.manipulator"))
}

jigsawInject {
}

repositories {
    mavenCentral()
    mavenLocal()
    maven {
        url "https://raw.githubusercontent.com/Mr-Zombii/git-maven/refs/heads/main/"
    }
}

dependencies {
    puzzleLoader "dev.puzzleshq:puzzle-loader-core:$puzzle_loader_core_version"
    puzzleLoader "dev.puzzleshq:puzzle-loader-cosmic:$puzzle_loader_cosmic_version"

    cosmicReach("finalforeach:cosmic-reach:${cosmic_reach_version}")

    clientImplementation commonImplementation("com.github.PuzzlesHQ:cosmic-api:${cosmic_api_version}:merged")

//    clientImplementation commonImplementation("com.github.stephengold:Libbulletjme:21.2.1")
//    clientImplementation commonImplementation("commons-io:commons-io:2.16.1")
//    clientImplementation commonImplementation("com.github.mgsx-dev.gdx-gltf:gltf:2.2.1") {
//        exclude group: "com.badlogicgames.gdx", module: "gdx"
//    }

//    commonImplementation "me.zombii:quicknet:$quiknet_version"
    clientImplementation commonBundle(commonImplementation("it.unimi.dsi:fastutil:$fastutil_version"))

    testImplementation("org.hjson:hjson:3.1.0")

    commonImplementation('party.iroiro.luajava:luajava:4.1.0')
    commonImplementation('party.iroiro.luajava:luajit:4.1.0')
    commonImplementation('party.iroiro.luajava:luajit-platform:4.1.0:natives-desktop')

    commonImplementation('com.twelvemonkeys.imageio:imageio-core:3.13.1')
    commonImplementation('com.twelvemonkeys.imageio:imageio-metadata:3.13.1')
    commonImplementation('com.twelvemonkeys.imageio:imageio-pdf:3.13.1')
    commonImplementation('com.twelvemonkeys.imageio:imageio-jpeg:3.13.1')
    commonImplementation('com.twelvemonkeys.imageio:imageio-tiff:3.13.1')
    commonImplementation('com.twelvemonkeys.imageio:imageio-webp:3.13.1')
    commonImplementation('com.twelvemonkeys.imageio:imageio-bmp:3.13.1')
    commonImplementation('com.twelvemonkeys.imageio:imageio-tga:3.13.1')

}

processCommonResources {
    def projectProperties = [
            "p_name": p_name,
            "p_version": ((String)version).contains(".") ? version : "0.0.0",
            "p_desc": p_desc,

            "p_id": p_id,
            "p_group": p_group,
            "p_author": p_author
    ]

    inputs.properties projectProperties

    filesMatching(["puzzle.mod.json"]) {
        expand projectProperties
    }
}

wrapper {
    gradleVersion = "8.14"
    distributionType = Wrapper.DistributionType.ALL
}
